name: zivizip-local
services:
  web:
    depends_on: [notes]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: development
    ports:
      - '127.0.0.1:5173:5173'
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/static:/app/apps/web/static
    init: true
  preview:
    depends_on: [notes]
    profiles: [preview]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: preview
    ports:
      - '127.0.0.1:4174:80'
  notes:
    build:
      context: .
      dockerfile: services/notes/Dockerfile
    environment:
      OWNER_FILE: /run/secrets/owner
      DATABASE_PATH: /data/notes.sqlite
      ALLOWED_ORIGINS: http://127.0.0.1:4174,http://localhost:4174,http://127.0.0.1:5173,http://localhost:5173
      COOKIE_SECURE: 'false'
    volumes:
      - notes-data:/data
    secrets:
      - owner
    init: true
secrets:
  owner:
    file: ./.local/owner.json
volumes:
  notes-data:
