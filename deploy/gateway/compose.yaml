name: platform-gateway

services:
  caddy:
    image: ${CADDY_IMAGE:?Set a tested Caddy image tag or digest}
    restart: unless-stopped
    environment:
      ZIVIZIP_DOMAIN: ${ZIVIZIP_DOMAIN:?Set the production domain}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - data:/data
      - config:/config
    networks: [public, zivizip]
    security_opt: [no-new-privileges:true]
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'

volumes:
  data:
  config:
networks:
  public:
  zivizip:
    external: true
    name: zivizip-ingress
